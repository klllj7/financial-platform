name: Deploy Node API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: financial-platform/node-api
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: node-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 획득 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      # DLP 서비스와 같은 이유. 레이어 캐시가 없으면 backend/ 안 코드 한 줄만
      # 바뀌어도 npm ci(node_modules 설치)부터 매번 처음부터 다시 한다.
      # GitHub Actions 캐시(type=gha)로 소스 코드 이전 레이어(npm ci)를 재사용한다.
      - name: 이미지 빌드·태그·푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ECS 서비스 강제 재배포
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: 배포 완료까지 대기 (헬스체크·롤아웃 확인)
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE